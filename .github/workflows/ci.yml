name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check server.js
          node --check setup.js
          find src -name '*.js' | xargs node --check

      - name: Unit tests
        run: npm test

      - name: Startup test
        run: echo '{}' | timeout 10 node server.js 2>&1 | grep -q 'Ready' && echo 'PASS' || exit 1
